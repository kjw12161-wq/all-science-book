<script>window.UNIT_DATA={"title":"화학 단원평가","units":[{"id":"unit1","title":"I. 물질의 세 가지 상태","desc":"기체의 성질 · 혼합 기체와 몰분율 · 액체의 분자 간 상호작용","questions":[["온도가 일정할 때 이상 기체의 압력을 2배로 만들면 부피는? ",["2배","1/2배","4배","변하지 않음"],1,"보일 법칙에서 온도가 일정하면 V는 P에 반비례한다.","비례 추론"],["같은 온도와 압력에서 기체의 몰수를 3배로 하면 부피는?",["1/3배","√3배","3배","변하지 않음"],2,"아보가드로 법칙에서 같은 T, P일 때 V는 n에 비례한다.","법칙 연결"],["이상 기체 상태 방정식으로 옳은 것은?",["PV=nRT","P=nVR","PV=RT/n","P=nT/RV"],0,"노트의 이상 기체 상태 방정식은 PV=nRT이다.","공식 판별"],["혼합 기체에서 A의 몰분율이 0.25이고 전체 압력이 8 atm일 때 A의 부분 압력은?",["0.25 atm","2 atm","6 atm","8 atm"],1,"부분 압력은 P_A = X_A P_total이므로 0.25×8=2 atm이다.","복합 계산"],["다음 중 분산력에 대한 설명으로 옳은 것은?",["극성 분자에만 존재한다.","F, O, N에 직접 결합한 H에서만 생긴다.","모든 분자 사이에 존재하며 분자량이 클수록 커지는 경향이 있다.","분자량과 무관하게 항상 같은 크기다."],2,"노트에서는 분산력이 모든 분자 사이에 존재하고, 분자량이 클수록 커진다고 정리한다.","개념 판별"]]},{"id":"unit2","title":"II. 용액의 성질","desc":"물의 성질 · 몰랄 농도 · 끓는점 오름·어는점 내림 · 삼투","questions":[["몰랄 농도 2 mol/kg인 용액에서 용매가 0.5 kg이면 용질의 몰수는?",["0.25 mol","1 mol","2.5 mol","4 mol"],1,"m=n/용매 질량(kg)이므로 n=2×0.5=1 mol이다.","단위 변환"],["같은 용매와 K_b에서 몰랄 농도가 3배가 되면 끓는점 오름은?",["1/3배","같다","3배","9배"],2,"ΔT_b=K_b m이므로 몰랄 농도에 정비례한다.","비례 추론"],["삼투 현상에서 반투막을 사이에 두고 이동하는 것은?",["용질만 진한 쪽으로 이동한다.","용매가 묽은 쪽에서 진한 쪽으로 이동한다.","용매가 진한 쪽에서 묽은 쪽으로 이동한다.","용질과 용매가 모두 같은 양으로 이동한다."],1,"노트에서는 반투막을 경계로 묽은 용액에서 진한 용액 쪽으로 용매가 이동한다고 정리한다.","개념 판별"],["삼투압 Π=CRT에서 C를 2배, T를 1/2배로 바꾸면 Π는?",["1/2배","같다","2배","4배"],1,"Π는 C와 T의 곱에 비례하므로 2×1/2=1이다.","복합 비례"],["다음 중 물의 성질과 수소 결합의 관계로 노트에 제시된 것은?",["얼음의 밀도가 물보다 크다.","비열과 기화열이 매우 작다.","표면장력이 매우 크다.","수소 결합은 물의 성질과 무관하다."],2,"노트에서는 수소 결합과 관련된 물의 성질로 큰 비열·기화열과 큰 표면장력을 제시한다.","개념 연결"]]},{"id":"unit3","title":"III. 화학 변화의 자발성","desc":"엔탈피 · 헤스 법칙 · 엔트로피 · 깁스 자유 에너지","questions":[["반응물의 엔탈피 합이 500 kJ, 생성물의 엔탈피 합이 430 kJ이면 ΔH는?",["+70 kJ","-70 kJ","+930 kJ","-930 kJ"],1,"ΔH=ΣH(생성물)-ΣH(반응물)=430-500=-70 kJ이다.","계산형"],["발열 반응의 ΔH가 -80 kJ/mol이다. 역반응의 ΔH는?",["-160 kJ/mol","-80 kJ/mol","+80 kJ/mol","0"],2,"역반응으로 바꾸면 엔탈피 변화의 부호가 반대가 된다.","헤스 법칙"],["헤스 법칙의 핵심으로 옳은 것은?",["반응 속도가 경로와 무관하다.","처음 상태와 나중 상태가 같으면 반응 경로와 관계없이 총 엔탈피 변화가 같다.","촉매가 있으면 ΔH가 달라진다.","온도가 높을수록 항상 ΔH=0이다."],1,"노트에서는 초기 상태와 최종 상태가 같다면 반응 경로와 무관하게 총 엔탈피가 일정하다고 설명한다.","개념 추론"],["ΔH=+30 kJ, ΔS=+60 J/K일 때 T=500 K에서 ΔG는?",["-30 kJ","0","+30 kJ","+60 kJ"],1,"ΔG=ΔH-TΔS=30000-(500×60)=0 J이다.","단위 변환"],["노트의 자발성 판단에서 ΔG<0일 때에 해당하는 것은?",["자발적 반응(정반응)","동적 평형","비자발적 반응","엔탈피가 항상 0"],0,"노트는 ΔG<0을 자발적 반응(정반응), ΔG=0을 동적 평형, ΔG>0을 비자발적으로 정리한다.","조건 판별"]]},{"id":"unit4","title":"IV. 반응 속도","desc":"반응 속도식 · 1차 반응 반감기 · 유효 충돌 · 농도·온도·촉매","questions":[["일반적인 반응 속도식의 형태로 노트에 제시된 것은?",["v=k[A]^m[B]^n","v=[A]+[B]","v=k/A^mB^n","v=RT/P"],0,"노트의 반응 속도식은 v=k[A]^m[B]^n이다.","공식 판별"],["1차 반응의 반감기는 무엇과 무관하다고 정리되어 있는가?",["속도 상수 k","초기 농도","시간","로그 함수"],1,"노트에서는 1차 반응의 반감기 t_1/2=ln2/k가 초기 농도와 무관하게 일정하다고 설명한다.","개념 함정"],["유효 충돌의 두 조건으로 옳은 것은?",["질량이 같고 온도가 같다.","올바른 충돌 방향과 활성화 에너지 이상의 에너지를 가진다.","압력이 1 atm이고 0 K보다 높다.","촉매가 반드시 존재해야 한다."],1,"유효 충돌에는 올바른 방향과 활성화 에너지 이상의 충돌 에너지가 필요하다.","조건 결합"],["농도를 높였을 때 반응 속도가 증가하는 주된 이유는?",["입자의 질량이 커진다.","충돌 횟수가 증가한다.","활성화 에너지가 항상 0이 된다.","반응 엔탈피가 바뀐다."],1,"노트에서는 농도 증가 → 입자 수 증가 → 충돌 횟수 증가 → 반응 속도 증가로 정리한다.","인과 추론"],["촉매에 대한 설명으로 옳은 것은?",["새로운 반응 경로를 제공하여 활성화 에너지를 바꿀 수 있으며 ΔH는 변하지 않는다.","반응물과 생성물의 종류를 바꾼다.","ΔH의 부호를 반대로 바꾼다.","반드시 반응 속도를 감소시킨다."],0,"촉매는 새로운 경로를 제공해 활성화 에너지를 변화시키지만 노트의 강조점대로 반응 엔탈피 ΔH는 변하지 않는다.","개념 함정"]]}]};</script>
