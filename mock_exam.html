<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="기하, 화학, 물리학 영역별 45분 20문제 통합 과학 모의고사">
<title>통합 과학 모의고사</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/tailwind.config.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.mock-exam-body{margin:0;background:#fff;color:#111;font-family:Pretendard,system-ui,sans-serif}.dark .mock-exam-body{background:#020617;color:#e2e8f0}
.exam-nav{position:sticky;top:0;z-index:50;height:64px;display:flex;align-items:center;gap:20px;padding:0 22px;background:#fff;border-bottom:1px solid #e5e7eb}.dark .exam-nav{background:#0f172a;border-color:#334155}.exam-brand{font-weight:900;color:#111}.dark .exam-brand{color:#f8fafc}.exam-nav-title{flex:1;text-align:center;font-weight:900;font-size:17px}.theme-btn{border:0;background:transparent;cursor:pointer;font-size:21px;color:#374151}.dark .theme-btn{color:#e2e8f0}.dark-symbol{display:none}.dark .light-symbol{display:none}.dark .dark-symbol{display:inline}
.exam-shell{max-width:1180px;margin:0 auto;padding:34px 18px 70px}.exam-hero{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:38px;box-shadow:0 12px 35px rgba(15,23,42,.05)}.dark .exam-hero{background:#0f172a;border-color:#334155;box-shadow:none}.exam-kicker{font-size:11px;font-weight:900;letter-spacing:.13em;color:#64748b}.exam-hero h1{margin:8px 0;font-size:40px;font-weight:950;letter-spacing:-.04em}.exam-hero p{margin:0;max-width:760px;color:#4b5563;line-height:1.8}.dark .exam-hero p{color:#94a3b8}
.exam-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}.exam-card{appearance:none;text-align:left;background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:24px;cursor:pointer;transition:.2s;min-height:240px}.dark .exam-card{background:#0f172a;border-color:#334155}.exam-card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(15,23,42,.09)}.exam-card-icon{font-size:28px;font-weight:900}.exam-card.geometry .exam-card-icon{color:#7c3aed}.exam-card.chemistry .exam-card-icon{color:#0f766e}.exam-card.physics .exam-card-icon{color:#1d4ed8}.exam-meta{font-size:10px;font-weight:900;color:#94a3b8;letter-spacing:.08em;margin-top:18px}.exam-card h2{font-size:25px;margin:4px 0 8px}.exam-card p{font-size:13px;color:#64748b;line-height:1.7}.dark .exam-card p{color:#94a3b8}.exam-card span{display:inline-block;margin-top:16px;font-size:12px;font-weight:900;color:#111}.dark .exam-card span{color:#f8fafc}
.exam-top{display:flex;align-items:center;gap:18px;padding:15px 18px;margin-bottom:18px;background:#fff;border:1px solid #e5e7eb;border-radius:16px}.dark .exam-top{background:#0f172a;border-color:#334155}.exam-subject{display:block;font-size:12px;font-weight:900}.exam-subject.geometry{color:#6d28d9}.exam-subject.chemistry{color:#0f766e}.exam-subject.physics{color:#1d4ed8}.exam-top strong{font-size:17px}.timer-box{margin-left:auto;text-align:center;min-width:95px}.timer-box span{display:block;font-size:10px;color:#94a3b8}.timer-box strong{font-size:24px;letter-spacing:.04em}.timer-box strong.warning{color:#dc2626}.ghost-btn{border:1px solid #d1d5db;background:#fff;color:#374151;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer}.dark .ghost-btn{background:#0f172a;border-color:#475569;color:#e2e8f0}
.exam-layout{display:grid;grid-template-columns:220px 1fr;gap:18px}.question-map,.question-panel,.review-panel,.result-panel{background:#fff;border:1px solid #e5e7eb;border-radius:20px}.dark .question-map,.dark .question-panel,.dark .review-panel,.dark .result-panel{background:#0f172a;border-color:#334155}.question-map{padding:18px;height:max-content;position:sticky;top:88px}.question-map h3{margin:0 0 12px;font-size:14px}.q-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.q-dot{border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:8px 0;font-size:11px;font-weight:800;cursor:pointer}.dark .q-dot{background:#111827;color:#e2e8f0;border-color:#475569}.q-dot.current{background:#111827;color:#fff;border-color:#111827}.q-dot.answered:not(.current){background:#e8f0ff;border-color:#bfdbfe;color:#1d4ed8}.dark .q-dot.answered:not(.current){background:#172554;border-color:#1d4ed8}.map-note{font-size:10px;color:#94a3b8;line-height:1.7;margin-top:14px}
.question-panel{padding:34px;min-height:520px}.question-number{font-size:11px;font-weight:900;letter-spacing:.14em;color:#94a3b8}.question-panel h2{font-size:25px;line-height:1.55;margin:10px 0 28px;letter-spacing:-.02em}.choices{display:grid;gap:12px}.choice{display:flex;align-items:flex-start;gap:12px;padding:16px;border:1px solid #e5e7eb;border-radius:13px;cursor:pointer;background:#fff}.dark .choice{background:#0b1220;border-color:#334155}.choice:hover{border-color:#94a3b8}.choice.selected{border-color:#2563eb;background:#eff6ff}.dark .choice.selected{background:#172554;border-color:#3b82f6}.choice input{margin-top:4px}.choice-key{font-weight:900;min-width:24px}.exam-actions{display:flex;justify-content:space-between;margin-top:34px}.outline-btn,.primary-btn{border-radius:11px;padding:10px 18px;font-weight:900;cursor:pointer}.outline-btn{background:#fff;border:1px solid #d1d5db;color:#111}.dark .outline-btn{background:#0f172a;border-color:#475569;color:#e2e8f0}.outline-btn:disabled{opacity:.4;cursor:not-allowed}.primary-btn{border:1px solid #111827;background:#111827;color:#fff}.dark .primary-btn{background:#f8fafc;color:#0f172a;border-color:#f8fafc}
.result-panel{padding:46px;text-align:center}.result-panel h1{font-size:36px;margin:8px 0}.score-ring{width:150px;height:150px;border-radius:50%;border:10px solid #dbeafe;display:flex;flex-direction:column;justify-content:center;align-items:center;margin:26px auto 16px}.score-ring strong{font-size:46px;line-height:1}.score-ring span{font-size:12px;color:#64748b}.dark .score-ring{border-color:#1e3a8a}.result-summary{color:#64748b}.dark .result-summary{color:#94a3b8}.result-actions{display:flex;justify-content:center;gap:10px;margin-top:24px}.review-panel{margin-top:18px;padding:24px}.review-head{display:flex;justify-content:space-between;gap:10px;align-items:end;border-bottom:1px solid #e5e7eb;padding-bottom:14px}.dark .review-head{border-color:#334155}.review-head h2{margin:0}.review-head span{font-size:11px;color:#94a3b8}.review-item{padding:17px 4px;border-bottom:1px solid #eef2f7}.dark .review-item{border-color:#1e293b}.review-title{display:flex;justify-content:space-between;gap:14px}.review-title strong{font-size:13px;line-height:1.6}.review-title span{font-size:10px;font-weight:900;padding:4px 7px;border-radius:7px;height:max-content}.review-item.correct .review-title span{color:#047857;background:#ecfdf5}.review-item.wrong .review-title span{color:#b91c1c;background:#fef2f2}.review-answer{font-size:12px;font-weight:800;margin-top:7px}.review-item p{font-size:11px;color:#64748b;line-height:1.7;margin:5px 0}.dark .review-item p{color:#94a3b8}
.dark .exam-nav,.dark .exam-card,.dark .exam-hero,.dark .exam-top,.dark .question-panel,.dark .question-map,.dark .review-panel,.dark .result-panel{color:#e2e8f0}
@media(max-width:900px){.exam-cards{grid-template-columns:1fr}.exam-layout{grid-template-columns:1fr}.question-map{position:static}.exam-top{flex-wrap:wrap}.timer-box{margin-left:auto}.exam-hero h1{font-size:32px}}
@media(max-width:600px){.exam-shell{padding:20px 12px 50px}.exam-hero{padding:24px}.question-panel{padding:22px}.question-panel h2{font-size:20px}.exam-nav{padding:0 12px}.exam-nav-title{font-size:15px}}
</style>
</head>
<body class="mock-exam-body">
<header class="exam-nav"><a href="index.html" class="exam-brand">← 통합 과학</a><div class="exam-nav-title">통합 과학 모의고사</div><button id="themeToggleBtn" class="theme-btn" aria-label="테마 전환" title="라이트 / 다크 모드 전환"><span class="light-symbol">☀</span><span class="dark-symbol">☾</span></button></header>
<div id="app"></div>
<script src="js/app.js"></script>
<script src="js/mock_exam.js"></script>
</body>
</html>
