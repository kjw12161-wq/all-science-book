<script>window.UNIT_DATA={"title":"기하 단원평가","units":[{"id":"unit1","title":"01 이차곡선","desc":"포물선 · 타원 · 쌍곡선 · 초점 · 준선 · 점근선","questions":[["포물선 y²=20x의 초점 좌표는?",["(5,0)","(-5,0)","(0,5)","(0,-5)"],0,"y²=4px에서 4p=20이므로 p=5, 초점은 (p,0)=(5,0)이다.","계산형"],["타원 x²/49+y²/25=1의 장축 길이는?",["7","10","14","24"],2,"a=7이므로 장축의 길이는 2a=14이다.","계산형"],["타원은 두 초점까지의 어떤 값이 일정한 점들의 자취인가?",["거리의 합","거리의 차","거리의 곱","거리의 제곱합"],0,"타원은 두 초점까지 거리의 합이 일정하다.","개념 판별"],["x²/16-y²/9=1의 점근선 기울기 절댓값은?",["3/4","4/3","7/4","16/9"],0,"a=4,b=3이고 점근선은 y=±(b/a)x이므로 기울기 절댓값은 3/4이다.","공식 적용"],["쌍곡선의 두 초점까지 거리 조건으로 옳은 것은?",["거리의 합이 일정","거리의 차가 일정","거리의 곱이 일정","두 거리 중 큰 값이 일정"],1,"쌍곡선은 두 초점까지 거리의 차가 일정한 점들의 자취이다.","개념 비교"]]},{"id":"unit2","title":"02 이차곡선의 접선","desc":"접선 판별식 · 포물선 접선 공식 · 타원 접선 공식","questions":[["이차곡선과 직선의 교점이 하나로 겹치는 접선 조건을 판별식으로 나타내면?",["D<0","D=0","D>0","D=1"],1,"접선에서는 교점이 중근이 되므로 판별식 D=0이다.","판별식"],["포물선 y²=4px에서 기울기 m인 접선의 공식은?",["y=mx+p/m","y=mx-pm","y=mx+pm","y=mx+p"],0,"노트의 기울기 m인 포물선 접선 공식은 y=mx+p/m이다.","공식 판별"],["y²=20x에서 기울기 2인 접선의 y절편은?",["2","5/2","5","10"],1,"p=5이므로 p/m=5/2, y절편은 5/2이다.","계산형"],["포물선의 접점 (x1,y1)에서의 접선 공식으로 노트에 제시된 것은?",["y1y=2p(x+x1)","yy1=p(x+x1)","y1x=2p(y+y1)","x1x+y1y=1"],0,"노트에는 y1 y = 2p(x+x1) 형태가 제시되어 있다.","공식 회상"],["타원 x²/a²+y²/b²=1의 접점 (x1,y1)에서 접선 공식은?",["x1x/a²+y1y/b²=1","x1x/a+y1y/b=1","xx1+yy1=1","x/a+y/b=0"],0,"노트의 타원 접선 공식은 x1x/a² + y1y/b² = 1이다.","공식 적용"]]},{"id":"unit3","title":"03 공간도형","desc":"정사영 · 이면각 · 삼수선의 정리","questions":[["정사영 넓이 공식으로 옳은 것은?",["S'=S sinθ","S'=S cosθ","S'=S tanθ","S'=S/ cosθ"],1,"노트의 정사영 공식은 S'=S cosθ이다.","공식 판별"],["원래 넓이 80, 두 평면의 각이 60°일 때 정사영 넓이는?",["20","40","40√3","80"],1,"80×cos60°=40이다.","계산형"],["정사영 넓이가 원래 넓이의 √3/2라면 θ는?",["30°","45°","60°","90°"],0,"S'=S cosθ에서 cosθ=√3/2이므로 θ=30°이다.","역산형"],["노트의 삼수선 시각화가 직접 다루는 것은?",["용액 농도","공간상의 수직 관계","엔트로피 변화","기체 압력"],1,"노트는 삼수선과 이면각의 구조를 공간상의 수직 관계로 시각화한다.","개념 판별"],["같은 원래 넓이에서 θ가 0°에서 90°로 커지면 정사영 넓이는?",["계속 증가한다.","변하지 않는다.","0에 가까워진다.","항상 2배가 된다."],2,"S'=S cosθ이므로 0°에서 S, 90°에서 0으로 감소한다.","함수 해석"]]},{"id":"unit4","title":"04 공간좌표","desc":"3차원 직교좌표계 · 두 점 사이 거리 · 구의 방정식","questions":[["P(1,-2,3), Q(5,1,-1)의 거리는?",["√29","√32","√41","7"],2,"좌표 차는 (4,3,-4)이므로 거리는 √(16+9+16)=√41이다.","3차원 계산"],["원점과 (3,4,z)의 거리가 13일 때 z는?",["0","±10","±12","12"],2,"169=9+16+z²이므로 z²=144, z=±12이다.","조건 추론"],["공간좌표 두 점 사이 거리 공식에서 필요한 것은?",["x차이만","x,y 차이의 합","x,y,z 각 좌표 차이의 제곱합의 제곱근","세 좌표의 곱"],2,"세 좌표 차이를 각각 제곱하여 더한 뒤 제곱근을 취한다.","공식 구조"],["구의 방정식의 기본형으로 노트에 제시된 것은?",["(x-a)²+(y-b)²+(z-c)²=r²","x²+y²+z²=r","(x+a)+(y+b)+(z+c)=r²","x²+y²-z²=r²"],0,"중심 (a,b,c), 반지름 r인 구의 방정식은 제시된 형태이다.","공식 판별"],["두 점의 거리 계산에서 z좌표 차이를 빠뜨리면 결과는 실제 3차원 거리와 어떤 관계인가?",["항상 더 크다.","항상 같다.","실제 거리보다 작거나 같고 z차가 0일 때만 같다.","항상 2배다."],2,"z차이의 제곱을 빠뜨리면 제곱합이 작아지므로 계산값은 실제 거리보다 작거나 같다.","오류 분석"]]}]};</script>
