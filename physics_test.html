<script>window.UNIT_DATA={"title":"물리학 단원평가","units":[{"id":"unit1","title":"01 힘의 합성","desc":"벡터 · 합력 · 평행사변형법 · 삼각형법 · 힘의 평형","questions":[["힘은 무엇을 모두 가진 물리량인가?",["크기만","방향만","크기와 방향","시간만"],2,"노트에서 힘은 크기와 방향을 모두 갖는 벡터라고 정리한다.","개념 판별"],["합력이 0인 물체의 운동 상태로 옳은 것은?",["반드시 정지한다.","정지 또는 등속직선운동이다.","반드시 가속한다.","반드시 원운동한다."],1,"합력이 0이면 힘의 평형 상태이며 정지 또는 등속직선운동을 한다.","개념 연결"],["두 힘 F1,F2가 이루는 각이 0°일 때 합력의 크기는?",["|F1-F2|","F1+F2","0","√(F1²+F2²)"],1,"같은 방향이면 합력은 두 힘의 크기의 합이다.","극한 조건"],["6 N과 8 N의 두 힘이 서로 수직으로 작용할 때 합력은?",["2 N","10 N","14 N","48 N"],1,"피타고라스 정리로 √(6²+8²)=10 N이다.","계산형"],["합력이 최소가 되는 두 힘 사이의 각은?",["0°","45°","90°","180°"],3,"θ=180°에서 F=|F1-F2|로 최소가 된다.","비교 추론"]]},{"id":"unit2","title":"02 포물선 운동","desc":"수평·연직 운동의 독립성 · 초기속도 성분 · 최고점","questions":[["비스듬히 던진 물체의 운동은 어떻게 보는 것이 핵심인가?",["수평과 연직 운동이 서로 독립적으로 동시에 일어난다.","항상 원운동으로 본다.","연직 운동만 고려한다.","수평 속도도 계속 증가한다."],0,"노트에서는 수평 운동과 연직 운동이 독립적으로 동시에 일어난다고 설명한다.","개념 구조"],["초기속도 v0=20 m/s, 발사각 30°일 때 수평성분은?",["10 m/s","20 m/s","10√3 m/s","20√3 m/s"],2,"vx=v0 cos30°=20×√3/2=10√3 m/s이다.","성분 분해"],["포물선 운동의 최고점에서 연직 속도 성분은?",["최대이다.","0이다.","항상 음수이다.","수평성분과 같다."],1,"최고점에서는 위로 올라가던 연직 속도가 0이 된다.","조건 해석"],["같은 초기속력으로 발사각이 30°와 60°인 두 발사체의 수평 도달거리 관계는?",["30°가 더 크다.","60°가 더 크다.","같다.","항상 2배 차이 난다."],2,"같은 초기속력에서는 서로 보각인 30°,60°에서 수평 도달거리가 같다.","비교 추론"],["포물선 궤적을 구성하는 두 운동의 조합은?",["수평 등속 + 연직 등가속","수평 등가속 + 연직 등속","두 방향 모두 등속","두 방향 모두 등가속"],0,"노트에서 포물선 궤적은 수평 등속 운동과 연직 등가속 운동의 합성 결과로 정리된다.","구조 연결"]]},{"id":"unit3","title":"03 등속 원운동과 단진동","desc":"각속도 · 주기 · 구심가속도 · 원운동의 기본 관계","questions":[["각속도 ω와 주기 T의 관계로 옳은 것은?",["T=ω/2π","T=2π/ω","T=2πω","T=1/(2πω)"],1,"노트의 원운동 관계식에서 T=2π/ω이다.","공식 판별"],["같은 반지름에서 각속도를 2배로 하면 구심가속도는?",["1/2배","2배","4배","변하지 않음"],2,"구심가속도는 ω²에 비례하므로 2배가 되면 4배가 된다.","비례 추론"],["같은 속력에서 반지름을 절반으로 하면 구심가속도는?",["1/2배","2배","4배","변하지 않음"],1,"a_c=v²/r이므로 반지름이 절반이면 구심가속도는 2배가 된다.","비례 추론"],["등속 원운동에서 속력의 크기는 일정하지만 계속 변하는 것은?",["질량","방향","반지름","주기"],1,"등속 원운동에서는 속력의 크기는 일정하지만 속도 벡터의 방향이 계속 바뀐다.","개념 함정"],["구심가속도의 방향은 일반적으로 어디를 향하는가?",["접선 바깥쪽","원의 중심 방향","항상 위쪽","운동 반대 방향"],1,"원운동의 구심가속도는 원의 중심을 향한다.","방향 판별"]]},{"id":"unit4","title":"04 케플러·중력","desc":"케플러 법칙 · 중력의 거리 의존성 · 중력장","questions":[["케플러 제3법칙에서 궤도 장반경 a를 2배로 하면 공전주기 T는 몇 배가 되는가?",["2배","2√2배","4배","8배"],1,"T²∝a³이므로 a가 2배면 T는 2^(3/2)=2√2배이다.","비례 추론"],["두 천체 사이의 거리를 2배로 하면 만유인력의 크기는?",["2배","1/2배","1/4배","4배"],2,"중력은 거리의 제곱에 반비례한다.","거리 의존성"],["두 물체의 질량을 각각 2배, 거리를 2배로 바꾸면 중력의 크기는?",["1/4배","1/2배","같다","2배"],2,"F∝m1m2/r²이므로 분자는 4배, 분모는 4배가 되어 전체는 같다.","복합 비례"],["중력장은 무엇을 뜻하는가?",["질량이 없는 공간","중력의 영향을 받을 수 있는 공간적 영역","반드시 진공인 공간","빛만 통과하는 공간"],1,"중력장은 질량이 중력의 영향을 미치거나 받을 수 있는 공간적 영역으로 정리할 수 있다.","개념 판별"],["두 궤도에서 장반경 a의 비가 1:4라면 주기 T의 비는?",["1:2","1:4","1:8","1:16"],2,"T∝a^(3/2)이므로 4^(3/2)=8, 따라서 1:8이다.","비례 추론"]]},{"id":"unit5","title":"05 특수 상대성","desc":"길이 수축 · 고유시간 · 상대성의 두 공준","questions":[["특수 상대성 이론의 두 공준 중 하나로 옳은 것은?",["빛의 속력은 관성계에 따라 달라진다.","모든 관성계에서 물리 법칙의 형태는 동일하다.","중력은 모든 관성계에서 사라진다.","시간은 절대적으로 동일하다."],1,"노트에서는 모든 관성계에서 물리 법칙이 동일하다는 내용을 핵심 공준으로 제시한다.","공준 판별"],["빛의 속력에 대한 특수 상대성의 핵심 가정은?",["관성계에 따라 달라진다.","진공에서 모든 관성계가 측정하는 빛의 속력은 일정하다.","질량이 커질수록 0이 된다.","광원 속도만큼 증가한다."],1,"특수 상대성에서는 빛의 속력이 모든 관성계에서 일정하다는 점이 핵심이다.","공준 판별"],["빠르게 움직이는 물체의 길이는 정지한 관측자 기준에서 어떻게 보이는가?",["운동 방향으로 수축한다.","운동 방향으로 무한히 늘어난다.","변하지 않는다.","질량에 비례해 늘어난다."],0,"노트에서 특수 상대론적 효과로 움직이는 길이의 수축을 다룬다.","현상 판별"],["고유시간은 누구에게 측정되는 시간인가?",["두 사건이 한 장소에서 일어나는 계에서의 시간","항상 지구에서의 시간","광원에서만의 시간","가속계에서만의 시간"],0,"두 사건이 같은 위치에서 일어나는 기준계에서 측정되는 시간이 고유시간이다.","개념 판별"],["관성계가 달라도 동일하게 유지되는 것으로 노트에서 강조되는 것은?",["모든 물체의 질량","빛의 속력과 물리 법칙의 형태","모든 물체의 길이","절대적 동시성"],1,"특수 상대성의 두 공준은 관성계 독립적인 물리 법칙과 빛의 속력 불변을 핵심으로 한다.","개념 연결"]]},{"id":"unit6","title":"06 일반 상대성","desc":"등가원리 · 중력에 의한 시공간 곡률 · 빛의 경로","questions":[["일반 상대성 이론에서 등가원리가 말하는 핵심은?",["중력과 일정한 가속도 운동의 국소적 효과는 구별할 수 없다.","중력은 빛에 영향을 주지 않는다.","모든 가속도는 0이다.","질량이 있으면 빛이 정지한다."],0,"노트의 핵심은 균일한 중력장과 일정한 가속도 운동이 국소적으로 구별되지 않는다는 등가원리이다.","원리 판별"],["질량이 시공간에 만드는 것으로 설명되는 것은?",["시공간의 곡률","절대 시간","질량의 소멸","빛의 속력 변화"],0,"노트에서는 질량이 시공간의 곡률을 만든다고 시각화한다.","개념 연결"],["일반 상대성 관점에서 중력이 강한 곳에서 빛의 경로는?",["완전히 직선으로만 간다.","휘어진 시공간의 구조를 따라 휘어질 수 있다.","반드시 정지한다.","질량이 생긴다."],1,"노트의 시각화는 질량이 만든 시공간 곡률 때문에 빛의 경로도 휘어질 수 있음을 보여준다.","현상 해석"],["등가원리의 '국소적으로'라는 표현이 중요한 이유로 가장 적절한 것은?",["아주 넓은 영역의 모든 중력 현상이 완전히 같다는 뜻이기 때문이다.","한정된 작은 영역에서 중력 효과와 일정한 가속도 효과를 비교한다는 의미이기 때문이다.","중력을 무조건 무시한다는 뜻이기 때문이다.","빛이 없는 영역만 뜻한다."],1,"노트의 등가원리는 중력과 가속도 운동의 효과가 국소적으로 구별되지 않는다는 내용을 다룬다.","조건 해석"],["다음 중 일반 상대성의 설명과 가장 잘 연결되는 것은?",["질량 → 시공간 곡률 → 빛의 경로 변화","질량 → 시간 정지 → 모든 힘 소멸","가속도 → 질량 소멸 → 중력 소멸","빛 → 질량 증가 → 공간 평면화"],0,"노트의 그림과 설명은 질량이 시공간을 휘게 하고, 그 구조에 따라 빛의 경로가 휘어질 수 있음을 연결한다.","종합 연결"]]}]};</script>
