<script>window.UNIT_DATA={"title":"물리학 단원평가","units":[{"id":"unit1","title":"01 힘의 합성","desc":"비탈면 · 장력 · 라미의 정리 · 돌림힘 평형 · 받침대 반력","questions":[["마찰이 없는 두 빗면의 경사각이 각각 θ₁, θ₂이고, 질량 m₁, m₂인 물체가 하나의 실로 연결되어 정지해 있다. 도르래와 실의 질량 및 마찰을 무시할 때 평형 조건은?",["m₁sinθ₁=m₂sinθ₂","m₁cosθ₁=m₂cosθ₂","m₁tanθ₁=m₂tanθ₂","m₁/sinθ₁=m₂/sinθ₂","m₁sinθ₂=m₂sinθ₁"],0,"각 물체의 빗면 방향 평형에서 T=m₁g sinθ₁=T=m₂g sinθ₂가 성립한다. 따라서 m₁sinθ₁=m₂sinθ₂이다.","성분 분해·평형"],["천장과 이루는 각이 각각 60°, 30°인 두 실이 질량 M인 물체를 평형 상태로 매달고 있다. 실 A의 장력을 T_A, 실 B의 장력을 T_B라 할 때 T_A/T_B는?",["1/√3","1","√3","2","2√3"],2,"수평 성분 평형에서 T_A cos60°=T_B cos30°이므로 T_A/T_B=√3이다.","라미의 정리·연립"],["균일한 질량 M, 길이 L인 막대가 왼쪽에서 L/4 지점의 받침대 P와 오른쪽 끝에서 L/6 지점의 받침대 Q 위에 놓여 있다. 오른쪽 끝에 질량 m을 올렸을 때 P가 막대를 떠받치는 힘이 0이 되는 m은?",["M/2","M","2M/3","3M/2","2M"],4,"P의 반력이 0인 순간 Q를 회전축으로 잡으면 Mg(L/3)=mg(L/6)이므로 m=2M이다.","임계 조건·돌림힘"],["위 막대에서 P,Q의 반력을 R_P,R_Q라 하자. m<M일 때 R_Q를 가장 간단히 나타낸 것은?",["(M+m)g/7","(3M+9m)g/7","(4M−2m)g/7","(3M+3m)g/7","(7M+9m)g/12"],1,"P에서 Q까지의 거리는 7L/12이고 P를 회전축으로 잡으면 R_Q(7L/12)=Mg(L/4)+mg(3L/4)이므로 R_Q=(3M+9m)g/7이다.","복합 평형"],["위 막대에서 R_P가 음수가 되지 않기 위한 조건으로 옳은 것은?",["m≤M/2","m≤M","m≤3M/2","m≤2M","m≤3M"],3,"전체 평형에서 R_P=(4M−2m)g/7이다. 따라서 R_P≥0이려면 m≤2M이다.","검산·임계값"]]},{"id":"unit2","title":"02 포물선 운동","desc":"경사면 충돌 · 두 물체 충돌 · 포물선 포락선 · 판별식 · 에너지 보존","questions":[["경사각 30°인 빗면의 하단에서 빗면과 30°의 각을 이루도록 속력 v₀로 물체를 던진다. 물체가 다시 빗면과 충돌할 때까지의 시간은?",["v₀/(√3g)","2v₀/(√3g)","√3v₀/g","2v₀/g","v₀/g"],1,"빗면에 수직한 방향의 초기속도는 v₀/2이고, 중력의 수직 성분은 √3g/2이다. y=0의 두 근 중 t=0이 아닌 해는 2v₀/(√3g)이다.","좌표계 회전·이차방정식"],["높이 H의 절벽 위에서 A를 수평 속력 v₀로 던지는 동시에, 바닥에서 수평거리 L 떨어진 곳에서 B를 A의 출발점을 향해 비스듬히 던진다. 공기 저항을 무시할 때 두 물체가 같은 순간 같은 위치에서 만날 수 있게 하는 핵심 조건은?",["A와 B의 질량이 같다.","B의 초기 속력이 A보다 크다.","B의 발사 방향이 A의 출발점을 정확히 향한다.","충돌 높이가 H/2보다 높다.","B의 수평 도달거리가 정확히 2L이다."],2,"두 물체가 같은 중력가속도를 받으므로 상대운동에서 중력 효과가 상쇄된다. B가 A의 출발점을 정확히 조준하는 조건이 충돌 경로를 결정하며, 지면에 닿기 전에 만날 만큼 속력이 충분해야 한다.","상대운동·충돌 조건"],["지면에서 속력 v₀로 발사한 물체가 높이 h인 과녁을 맞춘다. 가능한 발사각 중 최대 수평거리를 나타내는 식은?",["(v₀/g)√(v₀²+2gh)","(v₀/g)√(v₀²−2gh)","(v₀/2g)√(v₀²−2gh)","(v₀/g)(v₀²−gh)","√(v₀²−2gh)/g"],1,"포물선 궤적을 tanθ에 대한 이차방정식으로 만들고 판별식 D≥0을 적용하면 x_max=(v₀/g)√(v₀²−2gh)가 나온다.","포락선·판별식"],["같은 속력 v₀로 발사하여 높이 h=3v₀²/(8g)에 있는 과녁을 맞힐 때, 가능한 최대 수평거리는?",["v₀²/(4g)","v₀²/(2g)","3v₀²/(4g)","v₀²/g","√3v₀²/(2g)"],1,"2gh=3v₀²/4이므로 x_max=(v₀/g)√(v₀²/4)=v₀²/(2g)이다.","수식 대입·비례"],["높이 h인 과녁과 수평거리 x가 주어졌을 때, 같은 초기속력 v₀로 과녁을 통과하는 발사각이 정확히 하나만 존재하는 경우의 조건은?",["판별식 D<0","판별식 D=0","판별식 D>0","v₀²<2gh","x=0만 가능"],1,"하나의 실수 발사각만 존재하는 경계 상황은 tanθ에 대한 이차방정식이 중근을 가질 때이므로 D=0이다. 이때 과녁은 포물선의 포락선 위에 있다.","경계 조건·중근"]]},{"id":"unit3","title":"03 등속 원운동과 단진동","desc":"원뿔 진자 · 구심력 · 용수철 에너지 · 위상차 · 단진동 중첩","questions":[["길이 L인 실에 매달린 물체가 연직과 θ의 각을 이루며 원뿔 진자를 이룬다. 원운동 주기 T는?",["2π√(L/g)","2π√(Lsinθ/g)","2π√(Lcosθ/g)","2π√(L/(gcosθ))","2π√(g/(Lcosθ))"],2,"연직 방향에서 T′cosθ=mg, 수평 방향에서 T′sinθ=m(Lsinθ)ω²를 함께 쓰면 T=2π√(Lcosθ/g)이다.","성분 분해·구심력"],["용수철 상수 k인 용수철에 질량 m인 물체가 진폭 A로 단진동한다. 변위 x=A/2인 순간 운동에너지 K와 탄성 퍼텐셜 에너지 U의 비 K:U는?",["1:1","2:1","3:1","1:3","4:1"],2,"전체 에너지는 1/2kA²이고 x=A/2에서 U=1/8kA²=전체의 1/4이다. 따라서 K=3/4E이므로 K:U=3:1이다.","에너지 보존"],["동일한 진폭 A, 주기 T의 두 단진동에서 A는 t=0에 평형점을 지나 +방향 최대속력으로 운동하고, B는 +A에서 정지해 있다. t=T/8일 때 x_A와 x_B의 관계는?",["x_A=x_B=0","x_A=−x_B","x_A=x_B=A/√2","x_A=0, x_B=A","x_A=A, x_B=0"],2,"x_A=A sinωt, x_B=A cosωt로 둘 수 있다. t=T/8이면 ωt=π/4이므로 둘 다 A/√2이다.","위상차·삼각함수"],["진폭이 각각 A인 두 단진동 x₁=A cosωt, x₂=A cos(ωt+60°)를 중첩한다. 합성 운동의 진폭은?",["A/2","A","√2A","√3A","2A"],3,"위상차가 60°인 동일 진폭 두 진동의 합성 진폭은 2A cos30°=√3A이다.","위상자·중첩"],["원뿔 진자에서 실의 장력 T′와 수평 구심력 F_c의 크기를 올바르게 나타낸 것은?",["T′=mg sinθ, F_c=mg cosθ","T′=mg/cosθ, F_c=mg tanθ","T′=mg cosθ, F_c=mg/cosθ","T′=mg tanθ, F_c=mg","T′=mg/cosθ, F_c=mg sinθ"],1,"연직 평형 T′cosθ=mg에서 T′=mg/cosθ이고, 수평 성분 T′sinθ=mg tanθ가 구심력이 된다.","힘 분해·연결"]]},{"id":"unit4","title":"04 케플러·중력","desc":"타원 궤도 속력 · 케플러 제3법칙 · 탈출 속도 · 에너지 보존","questions":[["타원 궤도를 도는 인공위성의 근지점 거리가 R, 원지점 거리가 3R이다. 근지점 속력이 v라면 원지점 속력은?",["3v","√3v","v","v/√3","v/3"],4,"근지점과 원지점에서는 속도와 위치벡터가 수직이므로 각운동량 보존 r₁v₁=r₂v₂가 성립한다. 따라서 Rv=3Rv₂이므로 v₂=v/3이다.","케플러 제2법칙·각운동량"],["행성 A의 궤도 장반경이 행성 B의 4배이다. 주기를 각각 T_A,T_B라 할 때 T_A/T_B는?",["2","4","8","16","64"],2,"케플러 제3법칙 T²∝a³이므로 (T_A/T_B)²=4³=64, 따라서 T_A/T_B=8이다.","케플러 제3법칙"],["질량 M, 반지름 R인 행성 표면에서 물체를 무한대까지 보내기 위한 최소 초기속력 v_e는?",["√(GM/R)","√(2GM/R)","2√(GM/R)","√(GM/2R)","GM/R"],1,"최소 탈출 조건에서는 무한대에서 속도와 퍼텐셜 에너지가 모두 0이다. 1/2mv_e²−GMm/R=0이므로 v_e=√(2GM/R)이다.","역학적 에너지 보존"],["질량이 4M이고 반지름이 2R인 새로운 행성의 탈출속력을 원래 행성의 탈출속력 v_e와 비교하면?",["v_e/2","v_e/√2","v_e","√2v_e","2v_e"],3,"v_e∝√(M/R)이므로 새 행성에서는 √2배가 된다.","비례 추론"],["질량 M, 반지름 R인 행성 표면에서 탈출속력의 절반 v_e/2로 물체를 수직 발사한다. 공기저항을 무시하고 최대거리에서 순간정지한다고 할 때, 행성 중심으로부터 최대거리 r_max는?",["4R/3","3R/2","2R","4R","8R/3"],0,"v_e²=2GM/R이므로 초기 운동에너지는 GMm/(4R), 전체 에너지는 −3GMm/(4R)이다. 최대점에서 −GMm/r_max=−3GMm/(4R)이므로 r_max=4R/3이다.","에너지 보존·탈출속도"]]},{"id":"unit5","title":"05 특수 상대성","desc":"동시성의 상대성 · 시간 팽창 · 길이 수축 · 로런츠 인자","questions":[["광속에 가까운 속력으로 움직이는 우주선 중앙의 광원이 앞뒤 벽에 동시에 빛을 보냈다. 우주선 내부 관찰자에게 두 벽에 빛이 동시에 도달했다면, 지상 관찰자가 볼 때 먼저 도달하는 쪽은?",["앞쪽 벽","뒤쪽 벽","동시에 도달","속력이 0일 때만 뒤쪽","알 수 없음"],1,"지상계에서는 우주선이 앞으로 이동하므로 뒤쪽 벽은 빛 쪽으로 다가오고 앞쪽 벽은 멀어진다. 따라서 뒤쪽 벽에 먼저 도달한다.","동시성의 상대성"],["정지계에서 측정한 뮤온의 고유수명이 2.2 μs이고 v=0.99c, 로런츠 인자 γ≈7.1이다. 지상 관찰자가 측정하는 수명은?",["0.31 μs","2.2 μs","7.1 μs","15.6 μs","20.2 μs"],3,"시간 팽창에 의해 지상계 시간은 t=γt₀≈7.1×2.2 μs=15.62 μs이다.","시간 팽창"],["정지계에서 길이 L₀인 막대가 운동 방향으로 0.6c로 움직인다. 지상계에서 측정한 길이 L은?",["0.36L₀","0.6L₀","0.8L₀","L₀/√2","L₀"],2,"길이 수축 L=L₀√(1−v²/c²)=L₀√0.64=0.8L₀이다.","길이 수축"],["고유수명이 3.0 μs인 입자가 0.8c로 움직인다. γ=5/3일 때 지상계에서 측정되는 수명은?",["1.8 μs","3.0 μs","4.0 μs","5.0 μs","6.25 μs"],3,"시간 팽창 t=γt₀=(5/3)×3.0 μs=5.0 μs이다.","수치 계산·시간 팽창"],["정지계에서 길이 10 m인 막대가 0.8c로 움직인다. 지상계에서 측정한 막대의 길이와 막대 전체가 지상의 한 고정점을 지나가는 시간은?",["10 m, 25/c s","8 m, 10/c s","6 m, 6/c s","6 m, 7.5/c s","5 m, 20/c s"],3,"길이 수축으로 L=10×√(1−0.64)=6 m이다. 고정점을 통과하는 시간은 Δt=L/(0.8c)=6/(0.8c)=7.5/c s이다.","길이 수축·운동 시간"]]},{"id":"unit6","title":"06 일반 상대성","desc":"등가원리 · 시공간 곡률 · 빛의 휘어짐 · 중력 시간 지연 · 적색 편이","questions":[["무중력 공간에서 우주선이 위쪽으로 9.8 m/s²의 등가속도 운동을 하고 있다. 우주선 안 관찰자가 공을 놓았을 때, 지구 표면의 정지한 관찰자가 공을 놓은 경우와 비교한 설명으로 옳은 것은?",["가속 우주선에서만 공이 위로 뜬다.","두 경우 모두 관찰자 기준 아래쪽으로 9.8 m/s²의 가속 효과가 나타난다.","지구에서는 아래로, 우주선에서는 제자리에 있다.","가속 우주선에서는 가속도가 0이다.","두 경우는 반드시 서로 다른 결과를 낸다."],1,"등가원리에 따르면 국소적으로 균일한 중력장과 일정한 가속도 운동은 역학적 실험으로 구별할 수 없다.","등가원리"],["일반 상대성 이론에서 질량이 큰 천체 주변에서 빛의 경로가 휘어지는 현상을 가장 적절히 설명하는 것은?",["빛의 속력이 공간에서 계속 감소하기 때문이다.","빛이 질량을 가지기 때문에 뉴턴식 힘을 직접 받기 때문이다.","질량과 에너지가 시공간의 곡률을 만들고 빛이 휘어진 시공간의 경로를 따르기 때문이다.","빛이 중력장에서는 정지하기 때문이다.","모든 빛은 질량 큰 천체를 향해 직선으로 떨어지기 때문이다."],2,"일반 상대성 이론에서는 질량과 에너지가 시공간의 구조를 바꾸고, 빛은 그 휘어진 시공간에서의 경로를 따라 진행한다고 설명한다.","시공간 곡률"],["강한 중력장 근처에 정지한 우주선을 멀리 떨어진 관찰자가 본다. 우주선에서 나온 빛과 우주선 내부 시계에 대한 관측으로 옳은 것은?",["빛은 청색 편이되고 시계는 빨라진다.","빛은 적색 편이되고 시계는 빨라진다.","빛은 적색 편이되고 시계는 느리게 흐른다.","빛은 청색 편이되고 시계는 느리게 흐른다.","둘 다 변화가 없다."],2,"강한 중력장에서는 멀리 있는 관찰자에게 중력 시간 지연이 나타나 우주선의 시계가 느리게 흐르는 것처럼 보이며, 탈출하는 빛은 적색 편이된다.","중력 시간 지연·적색 편이"],["태양 근처를 지나오는 별빛이 휘어져 관측되는 현상에 대한 설명 중 옳은 것은?",["빛은 질량이 없으므로 어떤 의미에서도 중력과 무관하다.","천체의 질량이 클수록 주변 시공간 곡률이 커져 빛의 경로가 더 크게 휘어질 수 있다.","태양 근처에서는 빛의 진공 속력이 반드시 절반이 된다.","별빛은 태양을 통과하며 직선으로만 진행한다.","관측되는 별 위치 변화는 오직 지구의 공전 때문만이다."],1,"일반 상대성 관점에서는 질량이 큰 천체가 주변 시공간의 곡률을 크게 만들어 빛의 경로에 영향을 줄 수 있다.","빛의 휘어짐"],["다음 상황 중 일반 상대성의 등가원리를 가장 직접적으로 적용한 것은?",["속도가 다른 두 물체의 충돌 시간 비교","우주 공간에서 일정한 가속도로 움직이는 엘리베이터 안의 공 운동과 균일한 중력장 속 공 운동 비교","0.6c에서 막대 길이 수축 계산","단진동의 위상차 계산","타원 궤도 장반경으로 공전주기 계산"],1,"등가원리는 국소적인 상황에서 일정한 가속도 운동과 균일한 중력장의 효과를 구별하기 어렵다는 내용을 직접 다룬다.","원리 적용"]]}]};</script>
</body></html>
